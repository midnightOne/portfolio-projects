# CI (roadmap Phase 5.1, D5): typecheck + lint + test + build on every PR and
# on pushes to the staging branch. Deterministic by design: provider spend is
# kept out of CI with AI_FAKE_MODE test doubles; the database is a real
# Postgres 16 + pgvector service container (the single squashed init migration
# self-provisions the extension and HNSW index, D54).
#
# NOTE: this workflow only ACTIVATES once pushed to GitHub — pushing is an
# explicit owner decision (D1: staging branch, no merges to main).

name: CI

on:
  pull_request:
  push:
    branches:
      - claude/semantic-content-management-review
      - feature/semantic-content-management-2

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfolio_ci
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-nextauth-secret
      AI_SESSION_SECRET: ci-only-session-secret
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-only-admin-password
      # Cloudflare's official always-pass Turnstile TEST keys (docs-public, not secrets)
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall runs `prisma generate`
      - name: Install dependencies
        run: npm ci

      - name: Apply migrations (squashed init provisions pgvector + HNSW)
        run: npx prisma migrate deploy

      - name: Seed base data + verification fixture
        run: |
          npm run db:seed
          npm run seed:fixture

      - name: Type-check (strict, tests included)
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Gateway coverage check (D33)
        run: npm run check:gateway

      - name: Spec hygiene check
        run: npm run check:specs

      - name: Test
        env:
          # Deterministic provider doubles — no real API spend in CI
          AI_FAKE_MODE: reasoning,voice,embeddings
        run: npm test

      - name: Build
        run: npm run build
